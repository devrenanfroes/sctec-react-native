<!-- 
 # Criar uma função de pedidos de uma pizzaria:
 
 1. Crie uma função chamada clientepedido que receba um paramêtro numeropedido.
 2. Dentro dessa função, considere as condições a seguir:

 - Se numeropedido for igual a 1, retorne a mensagem "Pizza de Calabresa"
 - Se numeropedido for igual a 2, retorne a mensagem "Pizza de Quatro Queijos"
 - Se numeropedido for igual a 3, retorne a mensagem "Pizza de Frango com Catupiry"
 - Se numeropedido for igual a 4, retorne a mensagem "Pizza de Brigadeiro"
 - Se numeropedido não entrar nas condições acima, retorne a mensagem:
 'Número do Pedido Inválido'
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Pedidos</title>
    <style>
        input, button {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Verificador de Pedidos - Pizzaria Artesanal LaNonha</h1>
    <label for="pedidoid">Número do Pedido</label>
    <input type="number" id="pedidoid">
    <button id="btnverificador" onclick="clientepedido()">Verificar Pedido</button>
    <p id="res"></p>
    <script src="script.js"></script>
</body>
</html>
