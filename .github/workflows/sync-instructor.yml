name: Sync instructor repository

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-instructor.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone instructor repository
        run: |
          git clone --depth 1 https://github.com/Desenvolvedor-Mobile-ReactNative-T1/codigo-tecnico-semanas.git /tmp/instructor-repo

      - name: Mirror instructor content
        run: |
          rsync -a --delete --exclude='.git' /tmp/instructor-repo/ ./

      - name: Commit synchronized content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already synchronized."
            exit 0
          fi
          git commit -m "Sync with instructor repository"
          git push origin HEAD:main
